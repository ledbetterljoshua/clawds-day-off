<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clawd's Day Off</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --panel:rgba(22,20,27,.84); --line:rgba(255,255,255,.1); --ink:#f4ede4; --dim:#a79e94;
  --acc:#d97757; --ok:#7bd88f; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --round:'M PLUS Rounded 1c',ui-rounded,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#cfe6f7;color:var(--ink);font-family:var(--mono);-webkit-tap-highlight-color:transparent}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;z-index:5;transition:opacity .6s,transform .6s}
.hidden{opacity:0!important;pointer-events:none!important}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(0,0,0,.18)}

#todo{top:max(14px,env(safe-area-inset-top));left:14px;padding:12px 14px;font-size:12.5px;line-height:1.75;min-width:250px;pointer-events:none}
#todo .th{color:var(--ink);font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:8px}
#todo .th .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc)}
#todo .row{display:flex;gap:8px;align-items:baseline;padding-left:14px;color:var(--ink)}
#todo .row .box{width:12px;color:var(--dim)}
#todo .row.done .box{color:var(--ok)}
#todo .row.done .lab{color:var(--dim);text-decoration:line-through;text-decoration-color:#ffffff40}
#todo .row.blocked .lab{color:var(--dim)}
#todo .det{color:var(--dim);letter-spacing:1px}
#todo .det i{font-style:normal}
#todo .who{margin-left:auto;padding-left:10px;color:var(--acc);font-size:11px}

#clock{top:max(14px,env(safe-area-inset-top));right:14px;padding:10px 14px;font-size:12.5px;text-align:right;line-height:1.6}
#clock .t{font-size:17px;font-weight:600}
#clock .s{color:var(--dim);font-size:11px}
#clock button{background:none;border:0;color:var(--dim);font:inherit;font-size:11px;cursor:pointer;margin-top:2px}

#crew{bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px}
.card{font-family:var(--mono);color:var(--ink);text-align:left;cursor:pointer;padding:9px 12px;min-width:150px;display:flex;flex-direction:column;gap:2px;font-size:12px;transition:transform .15s,border-color .15s,background .15s}
.card:hover{transform:translateY(-2px)}
.card.sel{border-color:var(--acc);background:rgba(60,32,24,.9);box-shadow:0 0 0 2px rgba(217,119,87,.35)}
.card b{font-weight:600}
.card .spec{color:var(--dim);font-size:11px}
.card .st{color:var(--acc);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
#hint{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 74px);left:50%;transform:translateX(-50%);font-size:12px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.55);white-space:nowrap;pointer-events:none;text-align:center}

#tip{position:fixed;z-index:6;pointer-events:none;font-size:11.5px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(14px,14px)}
#bubbles{position:fixed;inset:0;pointer-events:none;z-index:4}
.bub{position:absolute;transform:translate(-50%,-100%);background:rgba(22,20,27,.9);border:1px solid var(--line);color:var(--ink);font-size:11.5px;padding:4px 9px;border-radius:9px;white-space:nowrap;transition:opacity .25s}
.bub::after{content:'';position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:rgba(22,20,27,.9)}

#mini{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 104px);left:50%;transform:translateX(-50%);padding:14px 18px 12px;text-align:center;min-width:270px;touch-action:none;user-select:none;-webkit-user-select:none}
#mini .mt{font-weight:600;font-size:13px;margin-bottom:8px}
#mini .ms{color:var(--dim);font-size:11px;margin-top:8px}
.dial{--p:0;width:150px;height:150px;border-radius:50%;margin:4px auto;position:relative;cursor:grab;touch-action:none;background:conic-gradient(var(--acc) calc(var(--p) * 1turn),rgba(255,255,255,.1) 0)}
.dial:active{cursor:grabbing}
.dial::after{content:'';position:absolute;inset:14px;border-radius:50%;background:#1d1a22}
.dial .knob{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px;border-radius:50%;background:#d8343c;box-shadow:0 2px 0 #8e1d24;z-index:2}
.dial .hub{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:#5fb3b8;z-index:2}
.bar{width:260px;height:28px;border-radius:7px;background:rgba(255,255,255,.1);position:relative;margin:6px auto;cursor:pointer}
.bar .zone{position:absolute;top:0;bottom:0;background:rgba(123,216,143,.3);border:1px solid var(--ok);border-radius:5px}
.bar .cur{position:absolute;top:-5px;bottom:-5px;width:4px;margin-left:-2px;background:#fff;border-radius:2px;box-shadow:0 0 6px #fff}
.pourwrap{display:flex;gap:18px;align-items:center;justify-content:center}
.gauge{width:36px;height:150px;border-radius:9px;background:rgba(255,255,255,.1);position:relative;overflow:hidden}
.gauge .band{position:absolute;left:0;right:0;bottom:66%;height:22%;border-top:1px dashed #fff;border-bottom:1px dashed #fff;background:rgba(255,255,255,.08);z-index:2}
.gauge .fill{position:absolute;left:0;right:0;bottom:0;height:0}
.hold{font-family:var(--mono);font-size:13px;color:var(--ink);background:#2c2733;border:1px solid var(--line);border-radius:50%;width:110px;height:110px;cursor:pointer;touch-action:none;position:relative}
.hold:active,.hold.on{background:#3d3346;border-color:var(--acc)}
.res{font-size:12px;height:16px;margin-top:6px;color:var(--ok)}

#title,#end{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px;transition:opacity .8s}
#title{background:linear-gradient(180deg,rgba(255,255,255,0) 30%,rgba(255,226,190,.45) 100%)}
#title h1,#end h1{font-family:var(--round);font-weight:800;font-size:clamp(40px,8vw,84px);line-height:1;color:#fff;text-shadow:0 3px 0 #d97757,0 8px 30px rgba(120,60,30,.35);letter-spacing:-1px}
#title .sub,#end .sub{font-family:var(--round);font-weight:500;color:#fff;font-size:clamp(15px,2.4vw,20px);text-shadow:0 1px 8px rgba(0,0,0,.35)}
.go{font-family:var(--mono);font-size:15px;font-weight:600;color:#fff;background:var(--acc);border:0;border-radius:999px;padding:13px 30px;cursor:pointer;box-shadow:0 4px 0 #9b4a30,0 10px 30px rgba(155,74,48,.35);margin-top:10px}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #9b4a30}
.small{font-size:11px;color:#fff;opacity:.85;text-shadow:0 1px 4px rgba(0,0,0,.4)}
#end{justify-content:flex-start;padding-top:max(5vh,env(safe-area-inset-top));gap:10px;background:linear-gradient(180deg,rgba(5,6,20,.72),rgba(5,6,20,.35) 55%,rgba(5,6,20,0) 75%)}
#end .rating{font-family:var(--round);font-size:clamp(20px,3.4vw,30px);color:#ffe2b8}
#end .stats{font-size:12px;color:#d9d2ea;line-height:1.9}
.pix{width:66px;height:36px;image-rendering:pixelated}

@media (max-width:700px){
  #todo{font-size:11px;min-width:0;padding:9px 11px;line-height:1.6}
  #todo .who{display:none}
  #clock{padding:8px 10px}
  #clock .t{font-size:14px}
  #crew{width:calc(100vw - 20px);gap:6px}
  .card{min-width:0;flex:1;padding:7px 8px;font-size:11px}
  .card b{white-space:nowrap}
  .card .spec{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .st{max-width:100%;font-size:10px}
  #hint{font-size:11px;white-space:normal;width:92vw;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 84px)}
  #mini{bottom:auto;top:calc(max(14px,env(safe-area-inset-top)) + 150px)}
}
</style>

  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<canvas id="c"></canvas>

<div id="todo" class="hud panel hidden"></div>
<div id="clock" class="hud panel hidden"><div class="t">5:00 pm</div><div class="s">🎆 fireworks at 7:45</div><button id="mute">♪ sound on</button></div>
<div id="hint" class="hud hidden"></div>
<div id="crew" class="hud hidden"></div>
<div id="mini" class="hud panel hidden"></div>
<div id="tip" class="panel hidden"></div>
<div id="bubbles"></div>

<div id="title">
  <svg class="pix" viewBox="0 0 11 6" shape-rendering="crispEdges"><g fill="#d97757"><rect x="1" y="0" width="9" height="4"/><rect x="0" y="2" width="1" height="1"/><rect x="10" y="2" width="1" height="1"/><rect x="2" y="4" width="1" height="2"/><rect x="4" y="4" width="1" height="2"/><rect x="6" y="4" width="1" height="2"/><rect x="8" y="4" width="1" height="2"/></g><g fill="#141414"><rect x="3" y="1" width="1" height="2"/><rect x="7" y="1" width="1" height="2"/></g></svg>
  <h1>Clawd's Day Off</h1>
  <div class="sub">chapter one · かき氷 kakigōri</div>
  <button class="go" id="start">start the evening</button>
  <div class="small">best with sound · after <a href="https://x.com/ishuagra02/status/2107488996490166538" target="_blank" rel="noopener" style="color:inherit">“Claude's day off” by Ishu Agrawal (@ishuagra02)</a>, animated by Opus 5.5</div>
</div>
<div id="end" class="hidden"></div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const $ = s => document.querySelector(s);
const V3 = THREE.Vector3;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const rand = (a, b) => a + Math.random() * (b - a);
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ORANGE = 0xd97757;

// ───────────────────────── renderer / scene ─────────────────────────
const renderer = new THREE.WebGLRenderer({ canvas: $('#c'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 700);
scene.fog = new THREE.Fog(0xcfe6f7, 30, 240);

const gradTex = new THREE.DataTexture(new Uint8Array([120,120,120,255, 190,190,190,255, 255,255,255,255]), 3, 1);
gradTex.minFilter = gradTex.magFilter = THREE.NearestFilter; gradTex.needsUpdate = true;
const toon = (color, o = {}) => new THREE.MeshToonMaterial({ color, gradientMap: gradTex, ...o });
function mesh(geo, mat, x = 0, y = 0, z = 0, parent = scene, shadow = true) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = shadow; parent.add(m); return m;
}
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const rbox = (w, h, d, r = .05) => new RoundedBoxGeometry(w, h, d, 3, r);
const cyl = (rt, rb, h, s = 20) => new THREE.CylinderGeometry(rt, rb, h, s);
const sph = (r, w = 20, h = 14) => new THREE.SphereGeometry(r, w, h);
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); draw(x, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  t.userData = { c, x }; return t;
}
const dotTex = canvasTex(64, 64, x => {
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.35, 'rgba(255,255,255,.85)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
});

// ───────────────────────── lights ─────────────────────────
const hemi = new THREE.HemisphereLight(0xbcd8ff, 0xa08060, .9); scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff1dc, 2.4);
key.position.set(-6, 12, 9); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -14, right: 14, top: 10, bottom: -10, near: 1, far: 50 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.03;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0xffc070, .8); scene.add(rim);
const lanternLight = new THREE.PointLight(0xffa860, 0, 24, 1.4); lanternLight.position.set(0, 4.3, 0.8); scene.add(lanternLight);

// ───────────────────────── sky ─────────────────────────
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, toneMapped: false, fog: false,
  uniforms: { top: { value: new THREE.Color() }, horizon: { value: new THREE.Color() }, bottom: { value: new THREE.Color() },
    sunCol: { value: new THREE.Color() }, sunDir: { value: new V3(0, .3, -1) }, stars: { value: 0 }, time: { value: 0 } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `
    uniform vec3 top, horizon, bottom, sunCol, sunDir; uniform float stars, time; varying vec3 vDir;
    float hash(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,37.719))) * 43758.5453); }
    void main(){
      vec3 d = normalize(vDir); float h = d.y;
      vec3 col = mix(horizon, top, smoothstep(0.0, 0.5, h));
      col = mix(col, bottom, smoothstep(0.0, -0.2, h));
      float sd = max(dot(d, normalize(sunDir)), 0.);
      col += sunCol * (pow(sd, 6.) * .35 + pow(sd, 160.) * 1.2 + smoothstep(.9993, .9996, sd) * 2.5);
      vec3 q = floor(d * 380.);
      float s = step(.9972, hash(q)) * smoothstep(.04, .3, h);
      col += vec3(s) * stars * (.55 + .45 * sin(time * 2.5 + hash(q) * 60.));
      gl_FragColor = vec4(col, 1.);
      #include <colorspace_fragment>
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), skyMat));

const PAL = [
  [0.00, { top: '#2f6fd0', hor: '#cfe6f7', bot: '#9fb7cf', sun: '#fff2d6', key: '#fff1dc', keyI: 2.9, hs: '#bcd8ff', hg: '#a08060', hI: .85, rimI: .5, cloud: '#ffffff' }],
  [0.45, { top: '#4a6fc0', hor: '#ffd8a0', bot: '#c9a989', sun: '#ffc070', key: '#ffd29a', keyI: 2.6, hs: '#c8c8ff', hg: '#a07050', hI: .8, rimI: 1.0, cloud: '#ffe2c0' }],
  [0.70, { top: '#4b4f9c', hor: '#ff9e86', bot: '#b07a80', sun: '#ff7a4a', key: '#ffa078', keyI: 1.6, hs: '#b0a0e0', hg: '#7a5060', hI: .9, rimI: 1.2, cloud: '#ffb0a0' }],
  [0.86, { top: '#23285e', hor: '#c06a80', bot: '#503a60', sun: '#ff5a50', key: '#c07090', keyI: .8, hs: '#7a70c0', hg: '#403050', hI: .7, rimI: .6, cloud: '#a07090' }],
  [1.00, { top: '#070b26', hor: '#232a5c', bot: '#12122a', sun: '#000000', key: '#6070c0', keyI: .4, hs: '#5060a0', hg: '#202030', hI: .5, rimI: 0, cloud: '#384070' }],
].map(([p, o]) => { const r = {}; for (const k in o) r[k] = typeof o[k] === 'string' ? new THREE.Color(o[k]) : o[k]; return [p, r]; });
const pal = {}; for (const k in PAL[0][1]) pal[k] = typeof PAL[0][1][k] === 'number' ? 0 : new THREE.Color();
function samplePal(p) {
  let i = 0; while (i < PAL.length - 2 && p > PAL[i + 1][0]) i++;
  const [p0, a] = PAL[i], [p1, b] = PAL[i + 1]; const t = clamp((p - p0) / (p1 - p0), 0, 1);
  for (const k in a) { if (typeof a[k] === 'number') pal[k] = lerp(a[k], b[k], t); else pal[k].lerpColors(a[k], b[k], t); }
  return pal;
}

// ───────────────────────── distant world ─────────────────────────
const cloudMat = toon(0xffffff, { emissive: 0xffffff, emissiveIntensity: .25, fog: false });
function cloud(x, y, z, s, n) {
  const g = new THREE.Group(); const geo = new THREE.IcosahedronGeometry(1, 2);
  for (let i = 0; i < n; i++) {
    const t = i / n; const r = s * (1 - t * .45) * rand(.55, 1);
    const m = new THREE.Mesh(geo, cloudMat);
    m.position.set(rand(-1, 1) * s * (1.5 - t), t * s * 2.1 + rand(0, .3) * s, rand(-.5, .5) * s);
    m.scale.setScalar(r); g.add(m);
  }
  g.position.set(x, y, z); scene.add(g); return g;
}
const clouds = [cloud(-70, 8, -190, 16, 30), cloud(45, 10, -210, 10, 16), cloud(110, 20, -200, 9, 12), cloud(-150, 6, -190, 12, 14), cloud(10, 34, -240, 7, 9), cloud(170, 4, -170, 10, 12)];

const winTex = canvasTex(64, 64, (x) => {
  x.fillStyle = '#000'; x.fillRect(0, 0, 64, 64);
  for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) if (Math.random() < .38) { x.fillStyle = Math.random() < .7 ? '#ffd890' : '#bfe0ff'; x.fillRect(i * 8 + 2, j * 8 + 2, 4, 4); }
});
const cityMat = new THREE.MeshLambertMaterial({ color: 0x95a8c6, emissive: 0xffd08a, emissiveMap: winTex, emissiveIntensity: 0 });
{
  const N = 900, city = new THREE.InstancedMesh(box(1, 1, 1), cityMat, N), m4 = new THREE.Matrix4(), q = new THREE.Quaternion();
  for (let i = 0; i < N; i++) {
    const z = rand(-95, -320), x = rand(-1.3, 1.3) * -z, h = rand(4, 13) * (Math.random() < .06 ? 2.2 : 1);
    m4.compose(new V3(x, -22 + h / 2, z), q, new V3(rand(3, 8), h, rand(3, 8))); city.setMatrixAt(i, m4);
  }
  scene.add(city);
  const ground = mesh(new THREE.PlaneGeometry(1400, 1400), new THREE.MeshLambertMaterial({ color: 0x7d9478 }), 0, -22, 0, scene, false);
  ground.rotation.x = -Math.PI / 2;
}
const treeMat = toon(0x4f8f45), treeMat2 = toon(0x3c7a3c);
function tree(x, y, z, s) { const g = new THREE.Group(); for (let i = 0; i < 5; i++) { const m = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 1), i % 2 ? treeMat : treeMat2); m.position.set(rand(-.8, .8) * s, rand(0, .9) * s, rand(-.5, .5) * s); m.scale.setScalar(s * rand(.6, 1)); g.add(m); } g.position.set(x, y, z); scene.add(g); }
tree(-13.5, -2.6, -5, 2.4); tree(13.2, -2.2, -6, 2.8); tree(-16, -3, -10, 3); tree(16.5, -2.8, -11, 3.2);

function wire(y, z, sag, color = 0x2a2836) {
  const pts = []; for (let i = 0; i <= 40; i++) { const t = i / 40; pts.push(new V3(lerp(-220, 220, t), y - sag * (1 - Math.pow(2 * t - 1, 2)), z)); }
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color })));
}
wire(17, -45, 4); wire(18.4, -45, 4.2); wire(19.8, -46, 4.4);

// ───────────────────────── balcony ─────────────────────────
const wood = toon(0xc8935c), woodDark = toon(0x8a5a36), woodLight = toon(0xe0b27a);
mesh(box(23, .28, 2.4), wood, 0, -.14, 0);
for (const z of [-.6, 0, .6]) mesh(box(23, .01, .02), woodDark, 0, .002, z, scene, false);
mesh(box(23, 1.1, .12), woodDark, 0, -.8, 1.16);
for (let x = -11; x <= 11; x += .8) mesh(box(.14, 3, .14), woodDark, x, -2.8, .9);
for (const x of [-10.9, 10.9]) mesh(box(.35, 9.5, .35), woodDark, x, 1.5, -1.5);
mesh(box(22.5, .35, .35), woodDark, 0, 6.2, -1.5);

const lanternMats = [];
{
  const pts = []; for (let i = 0; i <= 30; i++) { const t = i / 30; pts.push(new V3(lerp(-10.7, 10.7, t), 5.7 - 1.1 * (1 - Math.pow(2 * t - 1, 2)), -1.3)); }
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0x302020 })));

  crew.forEach(c => { c.faceOverride = Math.PI; });
  await sleep(2.2);
  if (G.mound > 0) crew.forEach(c => { c.spoon.visible = true; c.workAnim = 'eat'; });
  await sleep(2.2);
  let fwT = 0, lastT = G.time;
  await new Promise(r => tween(14, (e) => {
    fwT -= G.time - lastT; lastT = G.time; if (fwT <= 0) { fwT = rand(.35, 1.0); firework(); if (Math.random() < .3) setTimeout(firework, 180); }
    G.eaten = e * .65;
  }, r));
  crew.forEach(c => { c.faceOverride = 0; c.workAnim = null; c.mood('happy', 99); c.happyT = .6; });
  cam.mode = 'final';
  for (let i = 0; i < 3; i++) setTimeout(firework, i * 600);
  await sleep(3);
  showEnd(complete);
}
function showEnd(complete) {

  const left = 1 - G.servePhase, q = G.quality.length ? G.quality.reduce((a, b) => a + b, 0) / G.quality.length : 1;
  const rating = c >= 1 && left > .25 && q > .8 ? 'a perfect summer evening ✦' : c >= 1 ? 'a lovely summer evening' : c >= .5 ? 'a little melty. still wonderful.' : c > 0 ? 'mostly ice. good company.' : 'no kakigōri — just fireworks and good company';

    <h1>Clawd's Kakigōri</h1><div class="sub">かき氷 · a summer evening, made in code</div>
    <div class="rating">${rating}</div>
    <div class="stats">served at ${clockText(G.servePhase)} · ${complete ? 'everything on top' : Math.round(c * 100) + '% of the recipe'}<br>
    you: ${s.tasksYou} tasks · helpers: ${s.tasksHelpers} tasks · ${s.deleg} delegations<br>
    helpers did ${Math.round(s.helpers / tot * 100)}% of the hands-on time${G.quality.length ? ` · your craft ${Math.round(q * 100)}%` : ''}</div>
    <button class="go" id="again">another evening</button>

  $('#end').classList.remove('hidden'); $('#clock').classList.add('hidden');

}

// ───────────────────────── main loop ─────────────────────────
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
let last = performance.now(), hudT = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000) * (G.speed || 1); last = now;
  G.time += dt;
  if (G.mode === 'play') {
    G.t += dt; G.phase = Math.min(1, G.t / G.dayLen);
    if (G.phase >= 1) serve(false);
    // manual walking
    if (held['a'] || held['arrowleft']) { endMini(true); clawd.pending = null; clawd.targetX = clamp(clawd.x - 1, -9.6, 9.6); }
    else if (held['d'] || held['arrowright']) { endMini(true); clawd.pending = null; clawd.targetX = clamp(clawd.x + 1, -9.6, 9.6); }
    else if (!clawd.pending && !mini && (G._wasWalking)) clawd.targetX = clawd.x;
    G._wasWalking = held['a'] || held['arrowleft'] || held['d'] || held['arrowright'];
    if (clawd.pending && clawd.arrived()) { const k = clawd.pending; clawd.pending = null; playerInteract(k); }
    helpers.forEach(h => helperTick(h, dt));
    if (mini) { G.stats.you += dt; mini.update(dt); }
  }
  for (let i = tweens.length - 1; i >= 0; i--) { const T = tweens[i]; T.t += dt; const e = Math.min(1, T.t / T.dur); T.fn(e); if (e >= 1) { tweens.splice(i, 1); T.done && T.done(); } }
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 3);
  applyPhase(G.phase);
  crew.forEach(c => c.update(dt));
  // world visuals
  G.cranking = Math.max(0, G.cranking - dt);
  crank.rotation.x = -G.crankAngle; blade.rotation.y = G.crankAngle * 2;
  if (G.cranking > 0) emitSnow(-2.4, 1.7, -.25, 2);
  hopperBlock.visible = G.hopper > 0; hopperBlock.scale.y = 1 - G.crankProg * .7; hopperBlock.position.y = 2.02 - G.crankProg * .1;
  const lvl = clamp((G.mound + (G.hopper > 0 ? G.crankProg : 0)) / 4, 0, 1) * (1 - G.eaten);
  const tsx = lvl > 0 ? .3 + .85 * lvl : .01, tsy = lvl > 0 ? .15 + 1.85 * lvl : .01;
  mound.scale.x = mound.scale.z = lerp(mound.scale.x, tsx, 1 - Math.exp(-dt * 6)); mound.scale.y = lerp(mound.scale.y, tsy, 1 - Math.exp(-dt * 6));
  const topY = .48 + .5 * mound.scale.y;
  topStraw.position.set(0, topY + .1, .05); topMint.position.set(.22, topY - .02, .12);
  drawSyrup();
  for (const c of ORDER) {
    const s = streams[c], on = G.pouring === c;
    s.visible = on;
    if (on) { const y0 = 2.38, y1 = bowl.position.y + topY; s.position.set(bottles[c].position.x, (y0 + y1) / 2, -.3); s.scale.set(1 + Math.sin(G.time * 30) * .15, y0 - y1, 1); }
    bottles[c].rotation.z = on ? Math.sin(G.time * 3) * .05 : 0;
  }
  updateSnow(dt); updateFireworks(dt);
  // rings
  for (const k in rings) {
    const r = rings[k]; const show = G.mode === 'play' && (hover?.station === k || (G.selected && ST[k].job && !jobDone(ST[k].job)));
    r.visible = !!show;
    if (show) { const [x, z] = k === 'bowl' ? [bowl.position.x, bowl.position.z] : RING_POS[k]; r.position.set(x, .012, z); r.material.opacity = (hover?.station === k ? .85 : .35) + Math.sin(G.time * 5) * .12; const s = k === 'shaver' || k === 'rack' ? 1.5 : 1.15; r.scale.setScalar(s); }
  }
  if ((term.redrawT = (term.redrawT || 0) - dt) <= 0) { drawTerm(); term.redrawT = .08; }
  updateCamera(dt);
  hudT -= dt; if (hudT <= 0 && G.mode === 'play') { renderHUD(); hudT = .12; }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
updateTray(); drawSyrup(); drawTerm(); applyPhase(0); baseFrame(cam); cam.pos.copy(cam.tpos); cam.look.copy(cam.tlook);
requestAnimationFrame(frame);

$('#start').onclick = () => {

  $('#title').classList.add('hidden'); setTimeout(() => $('#title').style.display = 'none', 800);
  intro();
};
// test hooks
window.__dbg = { G, helpers, clawd, assign, playerGo, serve, firework, ST, bowl, skipIntro() { if (G.waitingEnter) G.waitingEnter(); } };
