<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clawd's Day Off</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clawd's Day Off">
<meta name="theme-color" content="#2a2440">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Klee+One:wght@400;600&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
/* One visual world: a dusk-lit 3D balcony with dark terminal-style HUD panels, and a paper
   picture diary (なつやすみ えにっき) for everything between evenings. */
:root{
  color-scheme: dark;
  --panel:rgba(22,20,27,.84); --line:rgba(255,255,255,.1); --ink:#f4ede4; --dim:#a79e94;
  --acc:#d97757; --acc-deep:#9b4a30; --ok:#7bd88f; --warn:#f7d488;
  --paper:#fbfaf6; --paper-2:#f2efe6; --paper-ink:#2b2f3a; --pencil:#5b6274; --rule:#c9dcef; --stamp:#d8343c;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --round:'M PLUS Rounded 1c',ui-rounded,system-ui,sans-serif;
  --hand:'Klee One','M PLUS Rounded 1c',ui-rounded,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{touch-action:manipulation}
html,body{height:100%;overflow:hidden;background:#cfe6f7;color:var(--ink);font-family:var(--mono);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#boot{position:fixed;inset:0;display:grid;place-items:center;font-size:13px;color:#4a5263;background:#cfe6f7;z-index:50}
.hud{position:fixed;z-index:5;transition:opacity .6s,transform .6s}
.hidden{opacity:0!important;pointer-events:none!important}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(0,0,0,.18)}

/* todo: a Claude Code task list */
#todo{top:max(14px,env(safe-area-inset-top));left:14px;padding:12px 14px;font-size:12.5px;line-height:1.75;min-width:250px;max-width:min(380px,60vw);pointer-events:none}
#todo .th{font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:8px}
#todo .th .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc);flex:none}
#todo .row{display:flex;gap:8px;align-items:baseline;padding-left:14px}
#todo .row .box{width:12px;color:var(--dim);flex:none}
#todo .row.done .box{color:var(--ok)}
#todo .row.done .lab{color:var(--dim);text-decoration:line-through;text-decoration-color:#ffffff40}
#todo .row.blocked .lab{color:var(--dim)}
#todo .det{color:var(--dim);letter-spacing:1px}
#todo .det i{font-style:normal}
#todo .who{margin-left:auto;padding-left:10px;color:var(--acc);font-size:11px;white-space:nowrap}

#clock{top:max(14px,env(safe-area-inset-top));right:14px;padding:10px 14px;font-size:12.5px;text-align:right;line-height:1.6}
#clock .t{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
#clock .s{color:var(--dim);font-size:11px}
#clock .btns{display:flex;gap:10px;justify-content:flex-end}
#clock button{background:none;border:0;color:var(--dim);font-size:11px;cursor:pointer;margin-top:2px}
#clock button:hover{color:var(--ink)}

#crew{bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px;width:max-content;max-width:calc(100vw - 20px)}
.card{text-align:left;cursor:pointer;padding:9px 12px;min-width:150px;display:flex;flex-direction:column;gap:2px;font-size:12px;transition:transform .15s,border-color .15s,background .15s}
.card:hover{transform:translateY(-2px)}
.card.sel{border-color:var(--acc);background:rgba(60,32,24,.9);box-shadow:0 0 0 2px rgba(217,119,87,.35)}
.card b{font-weight:600}
.card .spec{color:var(--dim);font-size:11px}
.card .st{color:var(--acc);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
#hint{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 74px);left:50%;transform:translateX(-50%);font-size:12px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.55);width:max-content;max-width:min(92vw,760px);pointer-events:none;text-align:center}

#tip{position:fixed;z-index:6;pointer-events:none;font-size:11.5px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(14px,14px)}
#bubbles{position:fixed;inset:0;pointer-events:none;z-index:4}
.bub{position:absolute;transform:translate(-50%,-100%);background:rgba(22,20,27,.9);border:1px solid var(--line);color:var(--ink);font-size:11.5px;padding:4px 9px;border-radius:9px;white-space:nowrap;transition:opacity .25s}
.bub::after{content:'';position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:rgba(22,20,27,.9)}

#toasts{position:fixed;top:max(84px,calc(env(safe-area-inset-top) + 84px));left:50%;transform:translateX(-50%);z-index:8;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{padding:9px 14px;font-size:12.5px;opacity:0;transform:translateY(-8px);transition:opacity .35s,transform .35s}
.toast.in{opacity:1;transform:none}

#fade{position:fixed;inset:0;background:#0c0a18;opacity:0;pointer-events:none;z-index:45;transition:opacity .45s}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40;transition:opacity .35s}
#flash.on{opacity:.85;transition:none}
#skip{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:9;padding:8px 14px;font-size:12px;cursor:pointer;border-radius:999px}

/* minigames */
#mini{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 104px);left:50%;transform:translateX(-50%);padding:14px 18px 12px;text-align:center;min-width:270px;touch-action:none;user-select:none;-webkit-user-select:none}
#mini .mt{font-weight:600;font-size:13px;margin-bottom:8px}
#mini .ms{color:var(--dim);font-size:11px;margin-top:8px}
.dial{--p:0;width:150px;height:150px;border-radius:50%;margin:4px auto;position:relative;cursor:grab;touch-action:none;background:conic-gradient(var(--acc) calc(var(--p) * 1turn),rgba(255,255,255,.1) 0)}
.dial:active{cursor:grabbing}
.dial::after{content:'';position:absolute;inset:14px;border-radius:50%;background:#1d1a22}
.dial .knob{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px;border-radius:50%;box-shadow:0 2px 0 #8e1d24;z-index:2}
.dial .hub{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:#5fb3b8;z-index:2}
.bar{width:260px;max-width:70vw;height:28px;border-radius:7px;background:rgba(255,255,255,.1);position:relative;margin:6px auto;cursor:pointer}
.bar .zone{position:absolute;top:0;bottom:0;background:rgba(123,216,143,.3);border:1px solid var(--ok);border-radius:5px}
.bar .cur{position:absolute;top:-5px;bottom:-5px;width:4px;margin-left:-2px;background:#fff;border-radius:2px;box-shadow:0 0 6px #fff}
.pourwrap{display:flex;gap:18px;align-items:center;justify-content:center}
.gauge{width:36px;height:150px;border-radius:9px;background:rgba(255,255,255,.1);position:relative;overflow:hidden}
.gauge .band{position:absolute;left:0;right:0;border-top:1px dashed #fff;border-bottom:1px dashed #fff;background:rgba(255,255,255,.08);z-index:2}
.gauge .fill{position:absolute;left:0;right:0;bottom:0;height:0}
.hold{font-size:13px;background:#2c2733;border:1px solid var(--line);border-radius:50%;width:110px;height:110px;cursor:pointer;touch-action:none;position:relative}
.hold:active,.hold.on{background:#3d3346;border-color:var(--acc)}
.res{font-size:12px;height:16px;margin-top:6px;color:var(--ok)}

/* terminal overlay */
#term{position:fixed;z-index:12;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(760px,calc(100vw - 24px));height:min(52vh,460px);display:flex;flex-direction:column;background:#141218f2;border:1px solid #ffffff22;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.45);font-size:13px;transition:opacity .2s}
#term .tbar{display:flex;align-items:center;gap:7px;padding:9px 12px;border-bottom:1px solid #ffffff14;color:var(--dim);font-size:11.5px}
#term .tbar i{width:11px;height:11px;border-radius:50%;background:#ff5f57;flex:none}
#term .tbar i:nth-child(2){background:#febc2e}#term .tbar i:nth-child(3){background:#28c840}
#term .tbar span{margin-left:8px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#term .tx{background:none;border:1px solid #ffffff22;border-radius:6px;padding:2px 8px;color:var(--dim);cursor:pointer;font-size:11px}
#term .tbody{flex:1;overflow-y:auto;padding:12px 14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
#term .welcome{border:1px solid var(--acc);border-radius:8px;padding:9px 12px;margin-bottom:10px;white-space:normal}
#term .welcome b{color:var(--acc)}
#term .dim{color:var(--dim);font-size:12px}
#term .tl.cmd{margin-top:6px}
#term .tin{display:flex;gap:8px;padding:10px 14px;border-top:1px solid #ffffff14}
#term .pr{color:var(--acc);font-weight:600}
#term input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:16px}
@media (min-width:700px) and (pointer:fine){#term input{font-size:13px}}

/* ── the diary ── */
#overlay{position:fixed;inset:0;z-index:20;transition:opacity .6s;overflow:auto}
#overlay.title-view{display:flex;align-items:center;justify-content:flex-end;padding:24px max(16px,6vw);background:linear-gradient(90deg,rgba(255,255,255,0) 30%,rgba(30,24,40,.25))}
.pix{width:66px;height:36px;image-rendering:pixelated;flex:none}
.cover{width:min(430px,100%);background:var(--paper);color:var(--paper-ink);border-radius:6px 14px 14px 6px;box-shadow:-6px 0 0 #d6cfbf inset,0 24px 60px rgba(40,20,10,.35);overflow:hidden;display:flex;flex-direction:column}
.cv-kicker{font-family:var(--hand);font-weight:600;font-size:14px;padding:14px 22px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;color:var(--paper-ink)}
.cv-kicker span{font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--pencil)}
.cv-band{background:var(--acc);color:#fff;padding:18px 22px 20px;display:flex;flex-direction:column;gap:8px;position:relative}
.cv-band::after{content:'';position:absolute;left:0;right:0;bottom:-8px;height:8px;background:repeating-linear-gradient(90deg,#d97757 0 14px,#e99a7f 14px 28px)}
.cv-band h1{font-family:var(--round);font-weight:800;font-size:clamp(34px,6vw,46px);line-height:1;letter-spacing:-.5px;text-wrap:balance}
.cv-band .pix g:first-child{fill:#fff}
.cv-band .pix .eyes{fill:var(--acc)}
.cv-sub{font-family:var(--hand);font-size:15px;opacity:.95}
.cv-week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:22px 22px 10px}
.cv-day{position:relative;border:1.5px solid var(--rule);border-radius:8px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;gap:3px;min-width:0}
.cv-day b{font-family:var(--hand);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv-day span{font-size:9px;color:var(--pencil);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv-day.done{border-color:#f0b9a6;background:#fff4ef}
.cv-day .stamp{position:absolute;right:-8px;top:-10px;width:34px;height:34px}
.cv-day .stamp span{display:none}
.cv-name{font-family:var(--hand);font-size:15px;margin:6px 22px 4px;padding-bottom:4px;border-bottom:1.5px solid var(--rule);display:flex;gap:14px}
.cv-name span{color:var(--pencil);font-size:12px;align-self:center}
.cv-actions{display:flex;gap:10px;padding:16px 22px 8px;flex-wrap:wrap}
.go{font-family:var(--mono);font-size:14px;font-weight:600;color:#fff;background:var(--acc);border:0;border-radius:999px;padding:12px 24px;cursor:pointer;box-shadow:0 4px 0 var(--acc-deep),0 10px 24px rgba(155,74,48,.28)}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--acc-deep)}
.ghost{font-family:var(--mono);font-size:13px;color:var(--paper-ink);background:transparent;border:1.5px solid #cfc8b8;border-radius:999px;padding:10px 18px;cursor:pointer}
.ghost:hover{border-color:var(--acc);color:var(--acc-deep)}
.credit{font-size:10.5px;color:var(--pencil);padding:8px 22px 18px;line-height:1.5}
.credit a{color:inherit}

#overlay.book-view{display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));background:radial-gradient(ellipse at center,rgba(10,10,30,.25),rgba(10,8,24,.62))}
.book{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);width:min(1040px,100%);background:var(--paper);color:var(--paper-ink);border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.45);position:relative;max-height:100%;overflow:auto}
.book::before{content:'';position:absolute;left:45%;top:0;bottom:0;width:2px;background:linear-gradient(90deg,rgba(0,0,0,.08),rgba(0,0,0,0));pointer-events:none}
.pg{padding:26px 28px;min-width:0;display:flex;flex-direction:column;gap:14px}
.pg.left{background:linear-gradient(90deg,var(--paper) 92%,var(--paper-2))}
.pg-head h2{font-family:var(--round);font-weight:800;font-size:26px;text-wrap:balance}
.pg-kicker{font-family:var(--hand);font-size:13px;color:var(--pencil)}
.week{list-style:none;display:flex;flex-direction:column;gap:8px}
.wk{width:100%;display:grid;grid-template-columns:58px minmax(0,1fr) 58px;align-items:center;gap:10px;text-align:left;background:transparent;border:1.5px solid var(--rule);border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--paper-ink)}
.wk:hover{border-color:#e9b6a3}
.wk.sel{border-color:var(--acc);background:#fff4ef}
.wk.locked{opacity:.45;cursor:not-allowed}
.wk-date{font-family:var(--hand);font-weight:600;font-size:16px;display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.wk-date i{font-style:normal;font-size:11px;border:1.5px solid currentColor;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;color:var(--pencil)}
.wk-title{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-title b{font-family:var(--hand);font-size:16px;font-weight:600;margin-right:4px}
.wk-state{display:grid;place-items:center;height:42px}
.wk-state .stamp{width:44px;height:44px}
.wk-state .stamp span{font-size:6px}
.wk-state{position:relative;width:58px}
.wk-thumb{position:absolute;inset:3px 6px;width:46px;height:36px;object-fit:cover;border-radius:3px;opacity:.9}
.wk-state .stamp{position:absolute;z-index:1;right:-12px;top:-10px;width:34px;height:34px}
.wk-state .stamp span{display:none}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:10px}
.strip img,.strip span{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:3px;background:#e6ebf2;display:block}
.pg-done{font-family:var(--hand);font-size:14px;color:var(--pencil);margin-top:4px}
.stickers{border-top:1.5px dashed var(--rule);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.stickers .pg-kicker span{margin-left:6px;font-family:var(--mono);font-size:10px}
.stickers ul{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:6px}
.stk{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:1.5px dashed #d8d2c4;color:#c4bdae;font-size:12px;cursor:help}
.stk.on{border:2px solid #fff;background:radial-gradient(circle at 35% 30%,#fff,#ffe9d6);box-shadow:0 1px 3px rgba(0,0,0,.25);font-size:16px;transform:rotate(-6deg)}
.stk.on:nth-child(3n){transform:rotate(5deg)}
.stk-toast b{font-size:16px;margin-right:4px}
.crew-note{border-top:1.5px dashed var(--rule);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.crew-note ul{list-style:none;display:flex;flex-direction:column;gap:4px}
.crew-note li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:baseline;font-size:12.5px}
.cn-name{font-family:var(--hand);font-weight:600;font-size:15px}
.cn-name i{font-style:normal;font-weight:400;font-size:12px;color:var(--pencil);margin-left:4px}
.cn-n{font-size:11px;color:var(--pencil);font-variant-numeric:tabular-nums}
.wk-next{font-size:10px;color:var(--acc-deep);border:1px dashed var(--acc);border-radius:999px;padding:2px 7px}
.pg-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.pg-foot .credit{padding:0}
.dp-date{display:flex;justify-content:space-between;gap:12px;font-family:var(--hand);font-weight:600;font-size:16px;border-bottom:1.5px solid var(--rule);padding-bottom:6px;flex-wrap:wrap}
.dp-wx{color:var(--pencil);font-weight:400;font-size:14px}
.dp-pic{position:relative;aspect-ratio:16/10;max-width:100%;border:2px solid #8b93a6;border-radius:4px;background:#e9eef5}
.dp-pic img{width:100%;height:100%;object-fit:cover;display:block;border-radius:2px}
.dp-empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:6px;padding:20px;color:var(--pencil);background:repeating-linear-gradient(-45deg,#eef2f7 0 10px,#e6ebf2 10px 20px)}
.dp-empty b{font-family:var(--hand);font-size:34px;color:var(--paper-ink)}
.dp-empty span{font-family:var(--hand);font-size:14px;max-width:32ch}
.polaroid{position:absolute;left:-14px;top:-16px;width:34%;background:#fff;padding:5px 5px 18px;box-shadow:0 4px 12px rgba(0,0,0,.25);transform:rotate(-5deg);z-index:2}
.polaroid::before{content:'';position:absolute;left:30%;top:-9px;width:40%;height:16px;background:rgba(250,235,180,.75);transform:rotate(3deg)}
.polaroid img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.polaroid figcaption{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-family:var(--hand);font-size:11px;color:var(--pencil)}
.dp-pic .stamp{position:absolute;right:-22px;bottom:-46px;width:92px;height:92px;z-index:3}
.mac{font-family:var(--round)}
.dp-text{padding-right:56px}
.dp-text{font-family:var(--hand);font-size:16px;line-height:2em;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(2em - 1.5px),var(--rule) calc(2em - 1.5px),var(--rule) 2em);padding-top:2px;min-height:8em}
.dp-text p{max-width:62ch}
.dp-text .jp{font-weight:600}
.dp-stats{font-size:11px;color:var(--pencil)}
.dp-actions{display:flex;gap:10px;flex-wrap:wrap}
.stamp{color:var(--stamp);transform:rotate(-12deg);display:grid;place-items:center;position:relative;mix-blend-mode:multiply}
.stamp svg{position:absolute;inset:0;width:100%;height:100%}
.stamp span{position:relative;font-family:var(--hand);font-weight:600;font-size:12px;line-height:1.15;text-align:center;letter-spacing:-.5px}
.stamp.big span{font-size:13px}
.stamp.slam{animation:slam .5s cubic-bezier(.2,1.6,.4,1) both .35s}
@keyframes slam{from{transform:rotate(-30deg) scale(2.4);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}

#settings{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(10,8,24,.45);padding:16px;transition:opacity .25s}
.st-card{width:min(380px,100%);background:var(--paper);color:var(--paper-ink);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.st-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--round);font-size:18px}
.st-x{background:none;border:0;cursor:pointer;font-size:16px;color:var(--pencil)}
.st-row{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:13px}
.st-row input[type=range]{width:150px;accent-color:var(--acc)}
.st-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc)}
.st-seg{display:flex;border:1.5px solid #cfc8b8;border-radius:999px;overflow:hidden}
.st-seg button{background:none;border:0;padding:6px 12px;cursor:pointer;font-size:12px;color:var(--paper-ink)}
.st-seg button.on{background:var(--acc);color:#fff}
.st-danger{border-top:1.5px dashed var(--rule);padding-top:12px}
.st-confirm{font-size:12.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--stamp)}
.ghost.icon{padding:10px 14px}
@media (max-width:760px){
  #overlay.title-view{justify-content:center;align-items:flex-end;padding:16px;background:linear-gradient(180deg,rgba(255,255,255,0) 20%,rgba(30,24,40,.35))}
  .book{grid-template-columns:1fr}
  .book::before{display:none}
  .pg{padding:20px 18px}
  .pg.right{order:-1}
  .pg.left{background:var(--paper)}
}
@media (max-width:700px){
  #todo{font-size:11px;min-width:0;max-width:calc(100vw - 150px);padding:9px 11px;line-height:1.6}
  #todo .th{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  #todo .th .dot{display:inline-block;margin-right:6px}
  #clock .s{display:none}
  #clock .btns{gap:6px}
  #clock #menu{display:none}
  .cv-day b{font-size:12px}
  .cv-day .stamp{right:-6px;top:-12px;width:26px;height:26px}
  #todo .who{display:none}
  #clock{padding:8px 10px}
  #clock .t{font-size:14px}
  #crew{width:calc(100vw - 20px);gap:6px}
  .card{min-width:0;flex:1;padding:7px 8px;font-size:11px}
  .card b{white-space:nowrap}
  .card .spec{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .st{max-width:100%;font-size:10px}
  #hint{font-size:11px;white-space:normal;width:92vw;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 84px)}
  #mini{bottom:auto;top:calc(max(14px,env(safe-area-inset-top)) + 150px)}
  .cv-week{gap:4px;padding:18px 14px 8px}
  .cv-band,.cv-kicker,.cv-actions{padding-left:16px;padding-right:16px}
  .cv-name{margin-left:16px;margin-right:16px}
  .credit{padding-left:16px;padding-right:16px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
